<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slothy · Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

      const App = {
        template: `
          <div>
            <header class="site-header" :class="{ scrolled: isScrolled }">
              <nav class="nav container" aria-label="Navegación principal">
                <a class="brand" href="#inicio">
                  <span class="brand-mark" aria-hidden="true">◉</span>
                  <span>Slothy</span>
                </a>
                <div class="nav-links">
                  <a v-for="item in navItems" :key="item.label" :href="item.href">{{ item.label }}</a>
                  <a class="nav-cta" href="#demo">Probar experiencia</a>
                </div>
              </nav>
            </header>

            <main id="contenido">
              <section class="hero" id="inicio">
                <div class="container hero-grid">
                  <div>
                    <div class="eyebrow"><span></span> Los Mechachavales · Junior</div>
                    <h1>El museo que <em>escucha, responde</em> y aprende con cada niño.</h1>
                    <p class="hero-lead">Slothy convierte información cultural en una experiencia amigable, adaptada y participativa para niños de 2 a 12 años.</p>
                    <div class="hero-actions">
                      <a class="button primary" href="#demo">Vivir la demostración</a>
                      <a class="button secondary" href="#resumen-jueces">Resumen para jueces</a>
                    </div>
                    <div class="hero-proof">
                      <div><strong>3</strong><span>niveles por edad</span></div>
                      <div><strong>5</strong><span>funciones operativas</span></div>
                      <div><strong>1</strong><span>Raspberry Pi 4</span></div>
                    </div>
                  </div>
                  <div class="robot-card">
                    <svg viewBox="0 0 560 620" role="img" aria-label="Ilustración de Slothy">
                      <rect x="132" y="251" width="296" height="279" rx="88" fill="#6b4836" />
                      <circle cx="280" cy="210" r="90" fill="#e9d4b5" />
                      <rect x="172" y="318" width="216" height="144" rx="23" fill="#20372e" />
                      <rect x="184" y="330" width="192" height="120" rx="15" fill="#fdf3d4" />
                      <circle cx="230" cy="372" r="22" fill="#f28b30" />
                      <rect x="260" y="354" width="90" height="12" rx="6" fill="#1f4d3b" />
                    </svg>
                  </div>
                </div>
              </section>

              <section class="section" id="problema">
                <div class="container split-heading">
                  <div>
                    <div class="section-kicker">01 · El reto</div>
                    <h2>La cultura no debería sentirse lejana ni difícil.</h2>
                  </div>
                  <p>Muchos niños no pueden acceder fácilmente a un museo y, cuando lo hacen, el lenguaje técnico puede alejarles del contenido.</p>
                </div>
                <div class="container challenge-grid">
                  <article class="challenge-card" v-for="card in challengeCards" :key="card.title">
                    <div class="icon-box">{{ card.icon }}</div>
                    <h3>{{ card.title }}</h3>
                    <p>{{ card.text }}</p>
                  </article>
                </div>
              </section>

              <section class="section" id="solucion">
                <div class="container split-heading">
                  <div>
                    <div class="section-kicker">02 · La solución</div>
                    <h2>Slothy convierte información en conversación.</h2>
                  </div>
                  <p>El niño elige su nivel, pregunta con la voz y recibe una respuesta adaptada por edad.</p>
                </div>
                <div class="container flow-grid">
                  <article class="flow-step" v-for="step in flowSteps" :key="step.title">
                    <div class="icon-box">{{ step.icon }}</div>
                    <h3>{{ step.title }}</h3>
                    <p>{{ step.text }}</p>
                  </article>
                </div>
              </section>

              <section class="section learning" id="demo">
                <div class="container learning-grid">
                  <div>
                    <div class="section-kicker">03 · Demostración</div>
                    <h2>Una misma pregunta. Tres formas de aprender.</h2>
                    <p>Prueba cómo cambia la profundidad de la respuesta según la edad del usuario.</p>
                  </div>
                  <div class="demo-console">
                    <div class="console-top">
                      <div class="console-lights"><i></i><i></i><i></i></div>
                      <span>Simulador de aprendizaje Slothy</span>
                    </div>
                    <div class="console-body">
                      <div class="mode-tabs">
                        <button v-for="mode in modes" :key="mode.key" class="mode-tab" :class="{ active: selectedMode === mode.key }" @click="selectedMode = mode.key">
                          <span>{{ mode.range }}</span>
                          {{ mode.label }}
                        </button>
                      </div>
                      <label for="demo-question">Pregunta del visitante</label>
                      <select id="demo-question" v-model="selectedQuestion">
                        <option value="vasija">¿Qué es una vasija precolombina?</option>
                        <option value="museo">¿Por qué es importante un museo?</option>
                        <option value="conservar">¿Por qué debemos cuidar los objetos antiguos?</option>
                      </select>
                      <div class="robot-message">
                        <div class="mini-sloth">◉</div>
                        <div>
                          <span>{{ answerLabel }}</span>
                          <p>{{ currentAnswer }}</p>
                        </div>
                      </div>
                      <button class="button primary console-button" @click="speakAnswer">Escuchar respuesta</button>
                    </div>
                  </div>
                </div>
              </section>

              <section class="section technology" id="tecnologia">
                <div class="container split-heading">
                  <div>
                    <div class="section-kicker">04 · Tecnología</div>
                    <h2>Raspberry Pi 4 es el cerebro de Slothy.</h2>
                  </div>
                  <p>Centraliza el reconocimiento de voz, la consulta con IA y la respuesta hablada y motriz.</p>
                </div>
                <div class="container architecture">
                  <div class="architecture-node"><strong>Micrófono</strong></div>
                  <div class="architecture-node main-node"><strong>Raspberry Pi 4</strong></div>
                  <div class="architecture-node"><strong>IA</strong></div>
                  <div class="architecture-node"><strong>Voz</strong></div>
                  <div class="architecture-node"><strong>Servos</strong></div>
                  <div class="architecture-node small-node"><strong>Batería</strong></div>
                  <div class="architecture-node small-node"><strong>Contenido</strong></div>
                </div>
              </section>

              <section class="section" id="impacto">
                <div class="container split-heading">
                  <div>
                    <div class="section-kicker">05 · Impacto</div>
                    <h2>Una primera puerta hacia el Museo Nacional.</h2>
                  </div>
                  <p>Slothy puede acercar la experiencia cultural a niños que no pueden asistir físicamente al museo.</p>
                </div>
                <div class="container innovation-grid">
                  <article class="innovation-card" v-for="item in innovationCards" :key="item.title">
                    <h3>{{ item.title }}</h3>
                    <p>{{ item.text }}</p>
                  </article>
                </div>
              </section>

              <section class="section" id="equipo">
                <div class="container split-heading">
                  <div>
                    <div class="section-kicker">06 · Equipo</div>
                    <h2>Los Mechachavales</h2>
                  </div>
                  <p>Un proyecto colaborativo entre estudiantes del Colegio Laboratorio del CUP y PRAYM Academy.</p>
                </div>
                <div class="container team-grid">
                  <article class="team-card" v-for="member in teamMembers" :key="member.name">
                    <h3>{{ member.name }}</h3>
                    <p>{{ member.role }}</p>
                  </article>
                </div>
              </section>

              <section class="section" id="resumen-jueces">
                <div class="container challenge-card">
                  <div class="section-kicker">Resumen para jueces</div>
                  <h2>¿Por qué Slothy merece destacar?</h2>
                  <p>Porque responde a un problema real con una solución física, educativa y funcional.</p>
                </div>
              </section>
            </main>

            <footer class="footer">
              <div class="container footer-grid">
                <div>
                  <strong>Slothy</strong>
                  <p>Aprender de un museo, sin estar dentro del museo.</p>
                </div>
                <div>
                  <strong>WRO 2026</strong>
                  <p>Categoría Junior</p>
                </div>
                <div>
                  <strong>Equipo</strong>
                  <p>Los Mechachavales</p>
                </div>
              </div>
              <div class="container footer-bottom">
                <span>Proyecto educativo desarrollado para competición de robótica.</span>
                <a href="#inicio">Volver arriba ↑</a>
              </div>
            </footer>
          </div>
        `,
        setup() {
          const isScrolled = ref(false)
          const selectedMode = ref('oruguitas')
          const selectedQuestion = ref('vasija')
          const navItems = [
            { label: 'Problema', href: '#problema' },
            { label: 'Solución', href: '#solucion' },
            { label: 'Tecnología', href: '#tecnologia' },
            { label: 'Impacto', href: '#impacto' },
            { label: 'Equipo', href: '#equipo' }
          ]
          const challengeCards = [
            { icon: '↗', title: 'Distancia y acceso', text: 'No todos los niños pueden ir a un museo.' },
            { icon: 'Aa', title: 'Lenguaje complejo', text: 'La misma explicación no funciona para todas las edades.' },
            { icon: '◉', title: 'Poca interacción', text: 'Escuchar sin preguntar reduce el interés.' }
          ]
          const flowSteps = [
            { icon: '⌁', title: 'Elegir edad', text: 'Selecciona Oruguitas, Aventureros o Conquista.' },
            { icon: '◉', title: 'Hacer una pregunta', text: 'El micrófono recibe la voz del niño.' },
            { icon: '✦', title: 'Procesar con IA', text: 'Raspberry Pi 4 coordina la actividad.' },
            { icon: '◖', title: 'Responder', text: 'Slothy habla y mueve sus brazos.' }
          ]
          const modes = [
            { key: 'oruguitas', label: 'Oruguitas', range: '2–5' },
            { key: 'aventureros', label: 'Aventureros', range: '6–9' },
            { key: 'conquista', label: 'Conquista', range: '10–12' }
          ]
          const demoContent = {
            vasija: {
              oruguitas: 'Es un recipiente muy antiguo. Las personas lo usaban para guardar comida o agua.',
              aventureros: 'Es una pieza de barro creada por pueblos indígenas antes de la llegada de los españoles.',
              conquista: 'Una vasija precolombina es una pieza arqueológica de cerámica elaborada por sociedades indígenas previas al periodo colonial.'
            },
            museo: {
              oruguitas: 'Un museo cuida cosas especiales y nos enseña historias del pasado.',
              aventureros: 'Un museo protege objetos importantes y nos permite descubrir cómo vivían otras personas.',
              conquista: 'Un museo investiga, conserva y comunica patrimonio cultural con base en evidencia material.'
            },
            conservar: {
              oruguitas: 'Porque son parte de nuestra historia y no se pueden reemplazar.',
              aventureros: 'Porque cada objeto antiguo guarda pistas sobre quienes lo crearon.',
              conquista: 'Debemos conservarlos porque su pérdida elimina información invaluable sobre sociedades anteriores.'
            }
          }
          const modeNames = {
            oruguitas: 'Respuesta para 2–5 años',
            aventureros: 'Respuesta para 6–9 años',
            conquista: 'Respuesta para 10–12 años'
          }
          const answerLabel = computed(() => modeNames[selectedMode.value])
          const currentAnswer = computed(() => demoContent[selectedQuestion.value][selectedMode.value])
          const innovationCards = [
            { title: 'Dinámico', text: 'El niño elige, pregunta y observa respuestas físicas.' },
            { title: 'Adaptativo', text: 'La misma idea cambia según la edad del usuario.' },
            { title: 'Cercano', text: 'Su forma de perezoso reduce la sensación de tecnología.' },
            { title: 'Portable', text: 'Se puede llevar a escuelas y centros comunitarios.' }
          ]
          const teamMembers = [
            { name: 'Abdiel Matheo Solano', role: 'Modelado 3D y programación' },
            { name: 'Meredith Sánchez', role: 'Documentación y comunicación' },
            { name: 'Andrés Ventura', role: 'Diseño y desarrollo técnico' }
          ]

          function onScroll() {
            isScrolled.value = window.scrollY > 18
          }

          function speakAnswer() {
            if (!('speechSynthesis' in window)) return
            window.speechSynthesis.cancel()
            const utterance = new SpeechSynthesisUtterance(currentAnswer.value)
            utterance.lang = 'es-CR'
            utterance.rate = selectedMode.value === 'oruguitas' ? 0.78 : selectedMode.value === 'aventureros' ? 0.92 : 1
            const voice = window.speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith('es'))
            if (voice) utterance.voice = voice
            window.speechSynthesis.speak(utterance)
          }

          onMounted(() => {
            onScroll()
            window.addEventListener('scroll', onScroll, { passive: true })
          })
          onUnmounted(() => window.removeEventListener('scroll', onScroll))

          return { isScrolled, navItems, challengeCards, flowSteps, modes, selectedMode, selectedQuestion, answerLabel, currentAnswer, innovationCards, teamMembers, speakAnswer }
        }
      }

      createApp(App).mount('#app')
    </script>
  </body>
</html>
